services:
  backend:
    build:
      context: ./lsm engine
    environment:
      LSM_PORT: 8080
      LSM_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - lsm_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  # Optional S3 compatibility demo. Local files are the default path.
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    container_name: local-s3
    restart: unless-stopped

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console

    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-moneet}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-moneet123}
      MINIO_REGION: ${AWS_REGION:-ap-south-1}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-moneet}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-moneet123}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    entrypoint: /bin/sh
    command: >-
      -c "until mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY; do sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'MinIO bucket initialized';"
    restart: "no"

volumes:
  lsm_data:
  minio_data:
