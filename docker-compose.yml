version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: local-s3
    restart: unless-stopped

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console

    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-moneet}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-moneet123}
      MINIO_REGION: ${AWS_REGION:-ap-south-1}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-moneet}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-moneet123}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    entrypoint: /bin/sh
    command: >-
      -c "until mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY; do sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      echo 'MinIO bucket initialized';"
    restart: "no"

volumes:
  minio_data:
